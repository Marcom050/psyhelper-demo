[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psyhelper-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.51,<2", "altair>=5,<7", "pandas>=2,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
